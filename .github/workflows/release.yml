name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v0.1.0)'
        required: false
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  build-and-package:
    name: Build, Gate & Package Toolchain
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (for LSP tests)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Determine Version
        id: get_version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VER="${{ github.event.inputs.version }}"
          else
            VER="${GITHUB_REF_NAME}"
          fi
          echo "version=${VER}" >> $GITHUB_OUTPUT
          echo "Target Release Version: ${VER}"

      - name: Gate 1 - Full Test Suite
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File .\test.ps1

      - name: Gate 2 - Windows 3-Stage Bitwise Bootstrap Verification
        shell: powershell
        run: |
          Write-Host "=== Verifying Windows 3-Stage Self-Hosting Reproducibility ===" -ForegroundColor Cyan
          & .\bin\gatc.exe src\compiler.gat -o bin\stage2.exe
          & .\bin\stage2.exe src\compiler.gat -o bin\stage3.exe
          & .\bin\stage3.exe src\compiler.gat -o bin\stage4.exe
          $diff = (fc.exe /b bin\stage3.exe bin\stage4.exe | Out-String)
          if (-not $diff.Contains("no differences encountered")) {
            Write-Error "Bitwise reproducibility failure between stage3 and stage4!`n$diff"
            exit 1
          }
          Write-Host "Windows bitwise identity verified: 100% exact match!" -ForegroundColor Green
          Remove-Item -Force bin\stage2.exe, bin\stage3.exe, bin\stage4.exe

      - name: Build Fresh Native Toolchains (Windows & Linux)
        shell: powershell
        run: |
          Write-Host "=== Building Release Binaries from Source ===" -ForegroundColor Cyan
          # 1. Fresh Windows Binaries
          & .\bin\gatc.exe src\compiler.gat -o bin\gatc.exe
          & .\bin\gatc.exe cli\gat.gat -o bin\gat.exe

          # 2. Cross-Compile Native Linux x64 Binaries
          & .\bin\gat.exe build src\compiler.gat -o bin\gatc-linux-x64 --target=linux
          & .\bin\gat.exe build cli\gat.gat -o bin\gat-linux-x64 --target=linux

          # 3. Cross-Compile Native Linux ARM64 Binaries
          & .\bin\gat.exe build src\compiler.gat -o bin\gatc-linux-arm64 --target=linux-arm64
          & .\bin\gat.exe build cli\gat.gat -o bin\gat-linux-arm64 --target=linux-arm64

      - name: Package Release Archives
        shell: bash
        run: |
          VER="${{ steps.get_version.outputs.version }}"
          DIST_DIR="dist"
          mkdir -p "${DIST_DIR}"

          # Windows x64 Package
          WIN_PKG_NAME="gat-${VER}-windows-x64"
          mkdir -p "${WIN_PKG_NAME}/bin"
          cp bin/gat.exe bin/gatc.exe "${WIN_PKG_NAME}/bin/"
          cp -r std docs examples README.md LICENSE "${WIN_PKG_NAME}/"
          7z a "${DIST_DIR}/${WIN_PKG_NAME}.zip" "${WIN_PKG_NAME}"

          # Linux x64 Package
          LINUX_PKG_NAME="gat-${VER}-linux-x64"
          mkdir -p "${LINUX_PKG_NAME}/bin"
          cp bin/gat-linux-x64 "${LINUX_PKG_NAME}/bin/gat"
          cp bin/gatc-linux-x64 "${LINUX_PKG_NAME}/bin/gatc"
          cp -r std docs examples README.md LICENSE "${LINUX_PKG_NAME}/"
          tar -czvf "${DIST_DIR}/${LINUX_PKG_NAME}.tar.gz" "${LINUX_PKG_NAME}"

          # Linux ARM64 Package
          LINUX_ARM_PKG="gat-${VER}-linux-arm64"
          mkdir -p "${LINUX_ARM_PKG}/bin"
          cp bin/gat-linux-arm64 "${LINUX_ARM_PKG}/bin/gat"
          cp bin/gatc-linux-arm64 "${LINUX_ARM_PKG}/bin/gatc"
          cp -r std docs examples README.md LICENSE "${LINUX_ARM_PKG}/"
          tar -czvf "${DIST_DIR}/${LINUX_ARM_PKG}.tar.gz" "${LINUX_ARM_PKG}"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts-windows-linux
          path: dist/*
          if-no-files-found: error

  build-macos:
    name: Build & Verify macOS ARM64 Toolchain
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine Version
        id: get_version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VER="${{ github.event.inputs.version }}"
          else
            VER="${GITHUB_REF_NAME}"
          fi
          echo "version=${VER}" >> $GITHUB_OUTPUT

      - name: Verify macOS ARM64 Self-Hosting & Feature Tests
        run: |
          chmod +x bin/gatc bin/gat
          chmod +x test_macos.sh
          ./test_macos.sh

      - name: Package macOS ARM64 Archive
        shell: bash
        run: |
          VER="${{ steps.get_version.outputs.version }}"
          DIST_DIR="dist"
          mkdir -p "${DIST_DIR}"

          MACOS_PKG_NAME="gat-${VER}-macos-arm64"
          mkdir -p "${MACOS_PKG_NAME}/bin"
          cp bin/gat bin/gatc "${MACOS_PKG_NAME}/bin/"
          cp -r std docs examples README.md LICENSE "${MACOS_PKG_NAME}/"
          tar -czvf "${DIST_DIR}/${MACOS_PKG_NAME}.tar.gz" "${MACOS_PKG_NAME}"

      - name: Upload macOS Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts-macos
          path: dist/*
          if-no-files-found: error

  verify-linux-native:
    name: Verify Native Linux Bootstrap on Ubuntu
    needs: build-and-package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts-windows-linux
          path: dist

      - name: Extract Linux Archive & Smoke Test Native Toolchain
        run: |
          mkdir -p extracted_linux
          tar -xzvf dist/gat-*-linux-x64.tar.gz -C extracted_linux
          LINUX_DIR=$(find extracted_linux -maxdepth 1 -mindepth 1 -type d)
          GATC="${LINUX_DIR}/bin/gatc"
          GAT="${LINUX_DIR}/bin/gat"
          chmod +x "${GATC}" "${GAT}"

          echo "=== 1. Testing CLI Version ==="
          "${GAT}" version

          echo "=== 2. Testing Native Hello World Compilation ==="
          "${GATC}" examples/hello.gat -o hello_test --target=linux
          chmod +x hello_test
          ./hello_test

          echo "=== 3. Testing Linux Full Feature Suite ==="
          "${GAT}" build examples/test_linux_suite.gat -o test_suite --target=linux
          chmod +x test_suite
          ./test_suite

          echo "=== 4. Testing Native Linux-Hosted Self-Compilation Bootstrap ==="
          "${GATC}" src/compiler.gat -o gatc-gen2 --target=linux
          chmod +x gatc-gen2
          ./gatc-gen2 src/compiler.gat -o gatc-gen3 --target=linux
          chmod +x gatc-gen3
          cmp gatc-gen2 gatc-gen3
          echo "Native Linux 3-stage bitwise identity confirmed: 100% exact match!"

          # Cleanup smoke artifacts
          rm -rf extracted_linux hello_test test_suite gatc-gen2 gatc-gen3

  publish-release:
    name: Publish GitHub Release
    needs: [build-and-package, build-macos, verify-linux-native]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Windows & Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts-windows-linux
          path: dist

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts-macos
          path: dist

      - name: Compute Checksums
        run: |
          cd dist
          sha256sum *.zip *.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Determine Release Tag & Name
        id: release_meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.version }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: Gat Language ${{ steps.release_meta.outputs.tag }}
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/SHA256SUMS.txt
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            # Gat Programming Language Release ${{ steps.release_meta.outputs.tag }}

            `gat` is a self-hosted, statically typed systems programming language featuring automatic reference counting (ARC), direct machine code emission, and 100% bitwise-reproducible self-hosting across Windows, Linux, and macOS.

            ## Highlights & Features in this Release
            - **Native macOS Apple Silicon (ARM64) Support**: Direct Mach-O 64-bit object emission (`MH_OBJECT`, `CPU_TYPE_ARM64`), native Darwin syscall dispatch via `SVC #0x80`, and 100% bitwise-reproducible self-hosting on macOS.
            - **100% Self-Hosting on Windows, Linux, and macOS**: Native bitwise-reproducible compiler bootstraps identically across Windows (PE32+), Linux (ELF64 x86-64 & ARM64), and macOS (Mach-O ARM64).
            - **Zero-Dependency Direct Syscall Linux Target**: Emits static ELF64 executables utilizing direct Linux kernel syscalls (`mmap`, `nanosleep`, `open`, `read`, `write`, `fork`, `execve`, `clone`), requiring no libc or external linker on x86-64 and aarch64.
            - **Direct Windows Native Target**: Direct PE executable emission using `KERNEL32.dll` dynamic imports without external toolchain dependencies.
            - **Dual Memory Model**: Value `struct`s, ARC reference-counted `class`es with `deinit` destructors, non-owning `weak T` references, and unsafe `raw T` pointers.
            - **Linear-Scan Register Allocation & Optimization**: Live-interval register allocator combined with constant folding, dead-code elimination (DCE), and ARC retain/release elision.
            - **Package Management & Tooling**: Built-in `gat init`, `gat fetch` (Git dependency resolution), and Language Server Protocol (LSP 3.17) support for VS Code.

            ## Checksums (SHA-256)
            See attached `SHA256SUMS.txt`.
