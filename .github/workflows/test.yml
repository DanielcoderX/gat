name: Gat CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    name: Build & Verify Self-Hosting Compiler
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (for LSP verification)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Test Suite & Bootstrap Verification
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File .\test.ps1
